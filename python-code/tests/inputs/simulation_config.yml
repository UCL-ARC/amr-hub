mode: data driven # Simulation mode: "data driven" or "rule based"

location_data:
  format: duckdb
  path: tests/inputs/location_timeseries.duckdb
  table: location_timeseries
  schema_version: 1

buildings_path: tests/inputs/buildings.yml # Path to buildings geojson file

agent_movement_speed: 0.01 # Agent movement speed in units per time step
agent_stochasticity: 0.5 # Degrees of randomness applied to agent heading each step
agent_interaction_radius: 0.01 # Distance within which an agent is considered to have reached a target
agent_max_movement_attempts: 5 # Max attempts to find a movement step that avoids wall intersections

hcw_initial_fatigue: 0.0
hcw_initial_hunger: 0.0
hcw_initial_toilet_need: 0.0
patient_initial_hunger: 0.0
patient_initial_toilet_need: 0.0
hcw_fatigue_rate: 0.00001
hcw_hunger_rate: 0.00001
hcw_toilet_rate: 0.00001
patient_hunger_rate: 0.00001
patient_toilet_rate: 0.00001

time_needed_attend_patient: 15 # Timesteps needed for a healthcare worker to attend to a patient
time_needed_door_access: 1 # Timesteps needed for a healthcare worker to access a door (e.g., open/close)
time_needed_workstation: 30 # Timesteps needed for a healthcare worker to use a workstation
time_needed_occupy_content: 10 # Timesteps needed for a healthcare worker to occupy content (e.g. a bed, a chair, etc.)

start_time: 2024-01-01 07:00:00
end_time: 2024-01-01 19:00:00

length_of_timestep_in_seconds: 1 # Length of each timestep in seconds (e.g., 900 seconds = 15 minutes)
